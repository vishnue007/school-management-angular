<div class="fixed top-4 right-4 space-y-3 z-[9999]">
  <div *ngFor="let toast of toastService.toasts()"
       class="px-4 py-3 rounded-lg shadow-lg text-white flex items-center gap-3 animate-slide-in"
       [ngClass]="{
         'bg-green-600': toast.type === 'success',
         'bg-red-600': toast.type === 'error',
         'bg-blue-600': toast.type === 'info',
         'bg-yellow-500': toast.type === 'warning'
       }">

      <span>{{ toast.message }}</span>

      <button class="ml-3 text-white font-bold" (click)="toastService.remove(toast.id)">×</button>
  </div>
</div>
