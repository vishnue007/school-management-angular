<div *ngIf="confirm.isOpen()" class="fixed inset-0 bg-black/50 flex items-center justify-center z-[9999]">
  <div class="bg-white rounded-xl shadow-xl p-6 w-96 animate-fade-in">

    <h2 class="text-lg font-semibold mb-4">Confirm Action</h2>

    <p class="text-gray-700 mb-6">{{ confirm.message() }}</p>

    <div class="flex justify-end gap-3">
      <button
        class="px-4 py-2 rounded-md bg-gray-300 hover:bg-gray-400"
        (click)="confirm.cancel()">
        Cancel
      </button>

      <button
        class="px-4 py-2 rounded-md bg-red-600 text-white hover:bg-red-700"
        (click)="confirm.confirm()">
        Yes
      </button>
    </div>

  </div>
</div>
