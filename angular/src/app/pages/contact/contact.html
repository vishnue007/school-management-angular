<!-- Page Header -->
<section class="bg-blue-900 text-white py-16 text-center">
  <h1 class="text-4xl font-bold">Contact Us</h1>
  <p class="text-lg mt-2 opacity-90">
    We’d love to hear from you! Reach out anytime.
  </p>
</section>

<!-- Contact Info + Form -->
<div class="max-w-6xl mx-auto px-6 grid md:grid-cols-2 gap-12 py-16">

  <!-- Left Side: Contact Details -->
  <div>
    <h2 class="text-3xl font-bold text-blue-900">Get in Touch</h2>
    <p class="mt-3 text-gray-600">
      Have questions about our school, admissions, or programs?  
      Our team will respond as soon as possible.
    </p>

    <div class="mt-8 space-y-5 text-gray-700">
      <p class="flex items-start gap-3">
        <span class="material-icons text-blue-700">location_on</span>
        <span>Bright Future School,  
          Trivandrum, Tamil Nadu</span>
      </p>

      <p class="flex items-center gap-3">
        <span class="material-icons text-blue-700">call</span>
        +91 98765 43210
      </p>

      <p class="flex items-center gap-3">
        <span class="material-icons text-blue-700">email</span>
        school@example.com
      </p>
    </div>

    <!-- Google Map -->
    <div class="mt-8 rounded-xl overflow-hidden shadow-lg">
      <iframe
        class="w-full h-64"
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3911.764390374609!2d76.9560067755382!3d8.524139993824979"
        allowfullscreen=""
        loading="lazy"
      ></iframe>
    </div>
  </div>

  <!-- Right Side: Contact Form -->
  <div>
    <h2 class="text-3xl font-bold text-blue-900">Send a Message</h2>

    <form class="mt-6 space-y-6">
      <div>
        <label class="font-medium text-gray-700">Your Name</label>
        <input
          type="text"
          class="w-full mt-2 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-600 outline-none"
          placeholder="Enter your name"
        />
      </div>

      <div>
        <label class="font-medium text-gray-700">Your Email</label>
        <input
          type="email"
          class="w-full mt-2 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-600 outline-none"
          placeholder="Enter your email"
        />
      </div>

      <div>
        <label class="font-medium text-gray-700">Message</label>
        <textarea
          class="w-full mt-2 p-3 border border-gray-300 rounded-lg h-32 resize-none focus:ring-2 focus:ring-blue-600 outline-none"
          placeholder="Write your message..."
        ></textarea>
      </div>

      <button
        type="submit"
        class="w-full bg-blue-700 text-white py-3 rounded-lg font-semibold hover:bg-blue-800 transition"
      >
        Send Message
      </button>
    </form>
  </div>
</div>
