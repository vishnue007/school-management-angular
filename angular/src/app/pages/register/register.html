<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
  <div class="w-full max-w-lg bg-white shadow-xl rounded-2xl p-8">

    <h2 class="text-3xl font-bold text-center text-indigo-600 mb-6">
      School Registration
    </h2>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-5">
      
      <!-- Student Name -->
      <div>
        <label for="name" class="block text-gray-700 font-semibold mb-1">Student Name</label>
        <input
          type="text"
          id="name"
          formControlName="name"
          placeholder="Enter student name"
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-400 focus:outline-none"
        />
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block text-gray-700 font-semibold mb-1">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="Enter email"
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-400 focus:outline-none"
        />
        <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" class="text-red-500 text-sm mt-1">
          <span *ngIf="registerForm.get('email')?.errors?.['required']">Email is required</span>
          <span *ngIf="registerForm.get('email')?.errors?.['email']">Invalid email format</span>
        </div>
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-gray-700 font-semibold mb-1">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Enter password"
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-400 focus:outline-none"
        />
        <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="text-red-500 text-sm mt-1">
          Password is required
        </div>
      </div>

      <!-- Role -->
      <div>
        <label for="role" class="block text-gray-700 font-semibold mb-1">Role</label>
        <select
          formControlName="role"
          id="role"
          class="w-full px-4 py-2 border rounded-lg bg-white focus:ring-2 focus:ring-indigo-400 focus:outline-none"
        >
          <option value="" disabled selected>Select Role</option>
          <option value="student">Student</option>
          <option value="teacher">Teacher</option>
          <option value="admin">Admin</option>
        </select>
        <div *ngIf="registerForm.get('role')?.invalid && registerForm.get('role')?.touched" class="text-red-500 text-sm mt-1">
          Role is required
        </div>
      </div>

      <!-- Class -->
      <div>
        <label for="class" class="block text-gray-700 font-semibold mb-1">Class</label>
        <select
          formControlName="class"
          id="class"
          class="w-full px-4 py-2 border rounded-lg bg-white focus:ring-2 focus:ring-indigo-400 focus:outline-none"
        >
          <option value="" disabled selected>Select Class</option>
          <option *ngFor="let c of classes" [value]="c">{{ c }}</option>
        </select>
        <div *ngIf="registerForm.get('class')?.invalid && registerForm.get('class')?.touched" class="text-red-500 text-sm mt-1">
          Class is required
        </div>
      </div>

      <!-- Section -->
      <div>
        <label for="section" class="block text-gray-700 font-semibold mb-1">Section</label>
        <select
          formControlName="section"
          id="section"
          class="w-full px-4 py-2 border rounded-lg bg-white focus:ring-2 focus:ring-indigo-400 focus:outline-none"
        >
          <option value="" disabled selected>Select Section</option>
          <option *ngFor="let s of sections" [value]="s">{{ s }}</option>
        </select>
        <div *ngIf="registerForm.get('section')?.invalid && registerForm.get('section')?.touched" class="text-red-500 text-sm mt-1">
          Section is required
        </div>
      </div>

      <!-- Gender -->
      <div>
        <label for="gender" class="block text-gray-700 font-semibold mb-2">Gender</label>
        <div class="flex gap-6">
          <label class="flex items-center gap-2">
            <input type="radio" value="Male" formControlName="gender" />
            Male
          </label>

          <label class="flex items-center gap-2">
            <input type="radio" value="Female" formControlName="gender" />
            Female
          </label>
        </div>
        <div *ngIf="registerForm.get('gender')?.invalid && registerForm.get('gender')?.touched" class="text-red-500 text-sm mt-1">
          Gender is required
        </div>
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
        {{ errorMessage }}
      </div>

      <!-- Success Message -->
      <div *ngIf="successMessage" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded">
        {{ successMessage }}
      </div>

      <!-- Submit -->
      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-400 text-white font-semibold rounded-lg transition"
      >
        <span *ngIf="!isLoading">Register</span>
        <span *ngIf="isLoading">Registering...</span>
      </button>

      <p class="text-sm text-gray-600 mt-4 text-center">
        Already have an account?
        <a routerLink="/login" class="text-indigo-600 font-medium hover:underline cursor-pointer"> Login </a>
      </p>

    </form>
  </div>
</div>
