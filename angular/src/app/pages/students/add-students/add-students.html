<div class="min-h-screen bg-gradient-to-br from-blue-50 to-purple-100 p-6 flex justify-center">
  <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-4xl">

    <h2 class="text-3xl font-bold text-purple-700 mb-6 text-center">
      Add New Student
    </h2>

    <form class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <!-- First Name -->
      <div>
        <label class="block font-semibold mb-2">First Name</label>
        <input type="text"
          class="w-full border rounded-lg px-4 py-2 focus:ring focus:ring-purple-300"
          placeholder="Enter first name" />
      </div>

      <!-- Last Name -->
      <div>
        <label class="block font-semibold mb-2">Last Name</label>
        <input type="text"
          class="w-full border rounded-lg px-4 py-2 focus:ring focus:ring-purple-300"
          placeholder="Enter last name" />
      </div>

      <!-- Gender -->
      <div>
        <label class="block font-semibold mb-2">Gender</label>
        <select
          class="w-full border rounded-lg px-4 py-2 focus:ring focus:ring-purple-300">
          <option value="" disabled selected>Select gender</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
      </div>

      <!-- DOB -->
      <div>
        <label class="block font-semibold mb-2">Date of Birth</label>
        <input type="date"
          class="w-full border rounded-lg px-4 py-2 focus:ring focus:ring-purple-300" />
      </div>

      <!-- Class -->
      <div>
        <label class="block font-semibold mb-2">Class</label>
        <select
          class="w-full border rounded-lg px-4 py-2 focus:ring focus:ring-purple-300">
          <option value="" disabled selected>Select Class</option>
          <option>1st Standard</option>
          <option>2nd Standard</option>
          <option>3rd Standard</option>
          <option>4th Standard</option>
          <option>5th Standard</option>
        </select>
      </div>

      <div>
        <label class="block font-semibold mb-2">father Name</label>
        <input type="text"
          class="w-full border rounded-lg px-4 py-2 focus:ring focus:ring-purple-300"
          placeholder="Enter father name" />
      </div>

      <div>
        <label class="block font-semibold mb-2">Mother Name</label>
        <input type="text"
          class="w-full border rounded-lg px-4 py-2 focus:ring focus:ring-purple-300"
          placeholder="Enter mother name" />
      </div>

      <!-- Phone -->
      <div>
        <label class="block font-semibold mb-2"> Phone Number</label>
        <input type="tel"
          class="w-full border rounded-lg px-4 py-2 focus:ring focus:ring-purple-300"
          placeholder="Enter phone number" />
      </div>

      <!-- Address -->
      <div class="md:col-span-2">
        <label class="block font-semibold mb-2">Address</label>
        <textarea rows="3"
          class="w-full border rounded-lg px-4 py-2 focus:ring focus:ring-purple-300"
          placeholder="Enter address"></textarea>
      </div>

      <!-- Submit Button -->
      <div class="md:col-span-2 flex justify-center pt-4">
        <button type="submit"
          class="bg-purple-600 text-white px-8 py-3 rounded-xl font-semibold hover:bg-purple-700 shadow-lg transform hover:-translate-y-1 transition">
          Add Student
        </button>
      </div>

    </form>
  </div>
</div>
